<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="bobaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cup Gradient -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Cup Stroke Gradient -->
    <linearGradient id="cupStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Straw Gradient -->
    <linearGradient id="strawGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Terminal Code Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>

    <!-- Tapioca Pearl Gradient -->
    <radialGradient id="pearlGrad1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#03192e"/>
    </radialGradient>

    <radialGradient id="pearlGrad2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="40%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#3b0724"/>
    </radialGradient>

    <radialGradient id="pearlGrad3" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022c1d"/>
    </radialGradient>
  </defs>

  <!-- Base Rounded App Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Subtle Circuit / Terminal Grid lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <line x1="60" y1="120" x2="452" y2="120" stroke-dasharray="6,6"/>
    <line x1="60" y1="256" x2="452" y2="256" stroke-dasharray="6,6"/>
    <line x1="60" y1="392" x2="452" y2="392" stroke-dasharray="6,6"/>
    <line x1="140" y1="60" x2="140" y2="452" stroke-dasharray="6,6"/>
    <line x1="256" y1="60" x2="256" y2="452" stroke-dasharray="6,6"/>
    <line x1="372" y1="60" x2="372" y2="452" stroke-dasharray="6,6"/>
  </g>

  <!-- Big Straw (Angled through lid) -->
  <g transform="rotate(18 290 120)">
    <rect x="272" y="40" width="36" height="240" rx="18" fill="url(#strawGrad)" filter="url(#glow)"/>
    <!-- Straw Highlight Line -->
    <rect x="279" y="45" width="6" height="230" rx="3" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Boba Cup Body -->
  <path d="M 148 160 L 176 400 C 182 432, 206 448, 256 448 C 306 448, 330 432, 336 400 L 364 160 Z"
        fill="url(#cupGrad)" stroke="url(#cupStroke)" stroke-width="6" stroke-linejoin="round" />

  <!-- Cup Rim Lid -->
  <rect x="132" y="146" width="248" height="22" rx="11" fill="#0f172a" stroke="#38bdf8" stroke-width="5"/>
  <rect x="140" y="152" width="232" height="10" rx="5" fill="#38bdf8" opacity="0.3"/>

  <!-- Liquid Surface / Wave inside Cup -->
  <path d="M 160 220 Q 208 236 256 220 T 352 220 L 336 400 C 330 432 306 448 256 448 C 206 448 182 432 176 400 Z"
        fill="#0369a1" fill-opacity="0.35"/>

  <!-- Tapioca Boba Pearls with Neon Glow -->
  <!-- Row 1 (Bottom) -->
  <circle cx="216" cy="406" r="22" fill="url(#pearlGrad1)" filter="url(#bobaGlow)"/>
  <circle cx="260" cy="414" r="20" fill="url(#pearlGrad2)" filter="url(#bobaGlow)"/>
  <circle cx="302" cy="400" r="21" fill="url(#pearlGrad3)" filter="url(#bobaGlow)"/>
  
  <!-- Row 2 -->
  <circle cx="190" cy="372" r="19" fill="url(#pearlGrad3)" filter="url(#bobaGlow)"/>
  <circle cx="236" cy="368" r="23" fill="url(#pearlGrad1)" filter="url(#bobaGlow)"/>
  <circle cx="282" cy="366" r="21" fill="url(#pearlGrad2)" filter="url(#bobaGlow)"/>
  <circle cx="324" cy="362" r="18" fill="url(#pearlGrad1)" filter="url(#bobaGlow)"/>

  <!-- Row 3 -->
  <circle cx="212" cy="326" r="20" fill="url(#pearlGrad2)" filter="url(#bobaGlow)"/>
  <circle cx="262" cy="322" r="22" fill="url(#pearlGrad3)" filter="url(#bobaGlow)"/>
  <circle cx="308" cy="324" r="19" fill="url(#pearlGrad1)" filter="url(#bobaGlow)"/>

  <!-- Central Terminal Symbol (Prompt `>_` Overlay on Cup) -->
  <g filter="url(#glow)">
    <!-- Cyan Terminal Chevron `>` -->
    <path d="M 212 216 L 244 242 L 212 268" 
          fill="none" stroke="url(#neonCyan)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Neon Cursor `_` -->
    <line x1="262" y1="268" x2="298" y2="268" 
          stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Glossy Cup Highlight on Left Edge -->
  <path d="M 166 182 L 186 388 C 188 396 193 404 198 408" 
        stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.35" fill="none"/>
</svg>